<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-label="Default Yalemoji: a blank dark gray-blue face with a soft cast shadow">
  <defs>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offset"/>
      <feFlood flood-color="#23314B" flood-opacity="0.32" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="cast-shadow"/>
      <feMerge>
